<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}制品库{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --line:#8884; --accent:#2563eb; --bad:#b91c1c; --good:#15803d; }
  body { font-family: system-ui, "Noto Sans SC", sans-serif; margin: 0; padding: 0 1rem 4rem; line-height:1.5; }
  main { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; border-bottom: 1px solid var(--line); padding-bottom:.2rem;}
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { border: 1px solid var(--line); padding: .3rem .5rem; text-align: left; vertical-align: top; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; word-break: break-all; }
  form.inline { display: inline; }
  label { display: block; margin-top: .6rem; font-weight: 600; }
  input[type=text], input[type=number], textarea, input[type=file] { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; }
  textarea { min-height: 7rem; }
  button { margin-top: .8rem; padding: .45rem 1rem; cursor: pointer; }
  .msg { padding: .6rem .8rem; border-radius: 6px; margin: 1rem 0; border:1px solid; }
  .msg.ok { border-color: var(--good); color: var(--good); }
  .msg.err { border-color: var(--bad); color: var(--bad); }
  .hint { color: #777; font-size: .85rem; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .pill { display:inline-block; padding:.05rem .45rem; border-radius:999px; border:1px solid var(--line); font-size:.78rem; }
  .reuse { color: var(--good); } .build { color: var(--accent); }
  nav a { margin-right: 1rem; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body><main>
<h1>{% block heading %}制品库{% endblock %}</h1>
<nav><a href="{{ url_for('index') }}">概览</a><a href="{{ url_for('api_state') }}">状态 JSON</a></nav>
{% if error %}<div class="msg err">{{ error }}</div>{% endif %}
{% if flash %}<div class="msg ok">{{ flash }}</div>{% endif %}
{% block body %}{% endblock %}
</main></body></html>
